<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warmer — guess who I'm thinking of</title>
<meta name="description" content="A two-player guessing game. One of you thinks of a person, the other guesses, and every guess gets a 0–100 score for how close it is.">
<meta property="og:title" content="Warmer 🔥">
<meta property="og:description" content="I'm thinking of someone. Can you guess who?">
<meta name="theme-color" content="#3f3370">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#4b3d7d; --bg2:#2e2558; --card:#1d1a26; --card2:#26222f; --line:rgba(255,255,255,.08);
    --muted:#a19bb3; --orange:#ff7a59; --orange-ink:#2a1208;
    --c1:#7aa7ff; --c2:#6fd0ff; --c3:#ffd166; --c4:#ffad4d; --c5:#ff7a59;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg2)}
  html,body{margin:0;color:#fff;font-family:Inter,system-ui,sans-serif}
  body{min-height:100dvh;background:linear-gradient(180deg,var(--bg1) 0,var(--bg2) 700px,var(--bg2) 100%)}
  .wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 40px)}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .logo{font:700 22px 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;color:#fff;padding:0}
  .logo span{font-size:20px}
  .hlink{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:99px;padding:7px 14px;font:600 13px Inter;cursor:pointer}
  h1{font:700 40px/1.02 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.03em;margin:26px 0 10px}
  h2{font:700 24px/1.15 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 6px}
  p{line-height:1.5}
  .lead{color:#d9d4e8;font-size:17px;margin:0 0 22px}
  .card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 12px 34px rgba(10,5,30,.28);margin-bottom:14px}
  .card.solved{background:var(--orange);color:var(--orange-ink)}
  .eyebrow{font:600 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .solved .eyebrow{color:rgba(42,18,8,.7)}
  .big{font:700 30px/1.1 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em;margin:10px 0 4px;word-break:break-word}
  .sub{color:var(--muted);font-size:14px;line-height:1.45}
  .solved .sub{color:rgba(42,18,8,.8)}
  .badge{background:rgba(255,255,255,.08);color:#fff;border-radius:99px;padding:4px 9px;font:600 11px Inter;letter-spacing:0;text-transform:none;white-space:nowrap}
  .solved .badge{background:#17141f}
  .btn{border:0;border-radius:16px;padding:15px 18px;font:600 15px Inter;cursor:pointer;background:var(--orange);color:#fff;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:rgba(255,255,255,.1)}
  .btn.dark{background:#17141f}
  .btn.wa{background:#25d366;color:#06301a}
  .stack{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .field{width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:14px;color:#fff;font:500 17px Inter;padding:14px;outline:none}
  .field:focus{border-color:var(--orange)}
  label.l{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  .seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-top:12px}
  .seg button{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:10px;font:600 13px Inter;cursor:pointer}
  .seg button.on{background:#3a3450;color:#fff}
  .err{color:#ff9a9a;font-size:13px;margin-top:8px;min-height:18px}
  .how{display:grid;gap:10px;margin:8px 0 22px}
  .how div{display:flex;gap:12px;align-items:flex-start;color:#d9d4e8;font-size:15px;line-height:1.4}
  .how b{flex:0 0 28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font:700 13px 'Space Grotesk',system-ui,sans-serif;color:#fff}
  .ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{font:600 12px Inter;border-radius:7px;padding:3px 7px;color:#111;min-width:26px;text-align:center;display:inline-block}
  .gl{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .g{background:var(--card2);border-radius:14px;padding:11px 12px;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center}
  .g .n{color:var(--muted);font:600 12px Inter}
  .g .t{font-weight:600;font-size:15px;word-break:break-word}
  .g .bar{grid-column:2/4;height:5px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
  .g .bar i{display:block;height:100%;border-radius:9px}
  .g.pend .t{color:var(--muted)}
  .secret{background:var(--card2);border-radius:12px;padding:11px 13px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;border:0;width:100%;text-align:left;font-family:inherit}
  .secret b{color:#fff}
  .match{background:rgba(255,122,89,.15);color:var(--orange);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:12px}
  .scoreBox{display:flex;align-items:baseline;gap:12px;margin:18px 0 4px}
  .scoreBox b{font:700 54px/1 'Space Grotesk',system-ui,sans-serif;min-width:70px}
  input[type=range]{width:100%;accent-color:var(--orange);height:32px}
  .scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
  .quick button{border:0;border-radius:10px;padding:10px 0;font:700 14px 'Space Grotesk',system-ui,sans-serif;cursor:pointer;color:#111}
  .note{background:rgba(255,209,102,.12);color:#ffd166;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
  .small{font-size:12px;color:var(--muted)}
  .linkbtn{background:none;border:0;color:var(--muted);font:500 13px Inter;cursor:pointer;padding:10px 0;text-decoration:underline;text-underline-offset:3px}
  .games{display:flex;flex-direction:column;gap:8px}
  .gi{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(0,0,0,.18);border-radius:16px;padding:13px 14px;cursor:pointer;border:0;color:#fff;font:inherit;text-align:left;width:100%}
  .gi .who{font-weight:600}
  .gi .st{font-size:12px;color:var(--muted)}
  .gi .turn{background:var(--orange);color:#fff;border-radius:99px;font:600 11px Inter;padding:4px 9px;white-space:nowrap}
  .pass{position:fixed;inset:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));z-index:20;display:flex;align-items:center;justify-content:center;padding:30px}
  .pass .inner{max-width:400px;width:100%;text-align:center}
  .pass .emoji{font-size:54px}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);background:#fff;color:#111;border-radius:99px;padding:10px 18px;font:600 14px Inter;opacity:0;transition:.25s;pointer-events:none;z-index:30}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .hist .li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .hist .li:first-child{border-top:0}
  .confirm{background:var(--card2);border-radius:16px;padding:14px;margin-top:12px}

  .live{display:inline-flex;align-items:center;gap:6px;color:#7ef0a8;font:600 11px Inter;letter-spacing:.06em;text-transform:uppercase}
  .live i{width:7px;height:7px;border-radius:50%;background:#7ef0a8;box-shadow:0 0 0 0 rgba(126,240,168,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(126,240,168,.55)}70%{box-shadow:0 0 0 8px rgba(126,240,168,0)}100%{box-shadow:0 0 0 0 rgba(126,240,168,0)}}
  .waiting{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px}
  .dots{display:inline-flex;gap:4px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--orange);animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .meta-line{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin:-6px 0 12px}
  .bignum{font:700 56px/1 'Space Grotesk',system-ui,sans-serif}
  .gname{font:700 19px 'Space Grotesk',system-ui,sans-serif;word-break:break-word}
  .linkbtn:disabled{opacity:.5}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* ================= config ================= */
const SB_URL = 'https://ordrdywcxacchjlcvbgy.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9yZHJkeXdjeGFjY2hqbGN2Ymd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1NTU2NjEsImV4cCI6MjExMTEzMTY2MX0.LYgWlfNwsQ2vjDGeIHdN1rr3QrqQi5em2t0NlFUZarg'; // public anon key (safe to ship)
const POLL_MS = 3000;

/* ================= helpers ================= */
function h(tag, props, ...kids){
  const el=document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==='style') el.style.cssText=v;
    else el.setAttribute(k, v===true?'':v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}
const app=document.getElementById('app');
const norm=s=>String(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').trim().toLowerCase().replace(/[^a-z0-9֐-׿ ]/g,'').replace(/\s+/g,' ');
const clean=(s,max=50)=>String(s||'').replace(/\s+/g,' ').trim().slice(0,max);
const rid=(n=12)=>{ const c='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const a=new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a,x=>c[x%c.length]).join(''); };
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function warmth(s){
  if(s>=100) return {label:'Got it!', color:'#ffffff'};
  if(s>=85) return {label:'Hot!', color:'var(--c5)'};
  if(s>=65) return {label:'Getting warm', color:'var(--c4)'};
  if(s>=45) return {label:'Lukewarm', color:'var(--c3)'};
  if(s>=20) return {label:'Cold', color:'var(--c2)'};
  return {label:'Ice cold', color:'var(--c1)'};
}
const chip=s=>h('span',{class:'chip',style:`background:${warmth(s).color}`},s);

/* ================= device storage ================= */
const KEY='warmer.v2';
let mem={games:{}, token:null, myName:''};
try{ const r=localStorage.getItem(KEY); if(r){ const o=JSON.parse(r); if(o&&o.games) mem=Object.assign(mem,o); } }catch(e){}
if(!mem.token){ mem.token=rid(16); }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} }
persist();

/* ================= backend ================= */
async function rpc(fn, args){
  const res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method:'POST',
    headers:{'Content-Type':'application/json', apikey:SB_KEY, Authorization:'Bearer '+SB_KEY}, body:JSON.stringify(args) });
  if(!res.ok) throw new Error('Server error '+res.status);
  return res.json();
}
let rt=null, rtChan=null;
function realtimeJoin(id){
  realtimeLeave();
  try{
    if(!window.supabase || !window.supabase.createClient) return;
    rt = rt || window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:false}});
    rtChan = rt.channel('warmer-'+id, {config:{broadcast:{self:false}}})
      .on('broadcast',{event:'moved'},()=>refresh())
      .subscribe();
  }catch(e){ rtChan=null; }
}
function realtimeLeave(){ try{ if(rt && rtChan) rt.removeChannel(rtChan); }catch(e){} rtChan=null; }
function ping(){ try{ rtChan && rtChan.send({type:'broadcast', event:'moved', payload:{}}); }catch(e){} }

/* ================= game model =================
 state = { id, mode:'live'|'local', n:[name0,name1|null], tok:[t0,t1|null], fp:firstPicker, p:pickerIdx, r:round,
           st:'lobby'|'pick'|'guess'|'reveal'|'done', k:'famous'|'mutual'|null, g:[[text,score|null]], a, gu, s, h:[[picker,answer,n,gaveUp]] } */
const other=i=>1-i;
const lastGuess=s=>s.g[s.g.length-1];
function actor(s){
  if(s.st==='lobby') return -1;
  if(s.st==='pick') return s.p;
  if(s.st==='guess'){ const l=lastGuess(s); return l && l[1]==null ? s.p : other(s.p); }
  if(s.st==='reveal') return s.p;
  if(s.st==='done') return other(s.p);
  return s.p;
}
function newState(mode, n0, n1, fp){
  return {id:rid(12), mode, n:[n0,n1], tok:[mem.token, mode==='local'?'local':null], fp, p:fp, r:1,
          st: mode==='local' ? 'pick' : 'lobby', k:null, g:[], a:null, gu:0, s:0, h:[]};
}

/* ================= app state ================= */
let cur=null;      // {id, state, ver, mode}
let busy=false, flash='', passTo=null, undoInfo=null, deleteArm=false, loadErr='';
let pollT=null;

const isLive=()=>cur && cur.state.mode==='live';
function myRole(){ if(!cur) return -1; if(!isLive()) return actor(cur.state); return cur.state.tok.indexOf(mem.token); }
function secretsFor(id){ const g=mem.games[id]||{}; return g.secrets||{}; }
function setSecret(id, round, name){ mem.games[id]=mem.games[id]||{}; mem.games[id].secrets=Object.assign(secretsFor(id),{[round]:name}); persist(); }
function remember(){ // cache this game in the device's list
  const s=cur.state; const g=mem.games[s.id]||{};
  mem.games[s.id]=Object.assign(g,{id:s.id, mode:s.mode, state:s, ver:cur.ver, updated:Date.now()}); persist();
}
function gameUrl(id){ return location.origin+location.pathname+'?g='+id; }

function notifyTurn(prevActor){
  const s=cur.state, me=myRole(), a=actor(s);
  if(isLive() && a===me && prevActor!==me){
    try{ navigator.vibrate && navigator.vibrate(120); }catch(e){}
    if(document.visibilityState!=='visible'){ document.title='🔥 Your turn — Warmer'; }
  }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ document.title='Warmer — guess who I\'m thinking of'; refresh(); } });

/* load a live game from the server */
async function refresh(){
  if(!isLive() || busy) return;
  const id=cur.id;
  try{
    const r=await rpc('get_game',{p_id:id});
    if(!cur || cur.id!==id) return;
    if(loadErr){ loadErr=''; render(); }
    if(!r){ loadErr='This game doesn’t exist anymore.'; render(); return; }
    if(r.version>cur.ver){
      const prevActor=actor(cur.state);
      cur.state=r.state; cur.ver=r.version; undoInfo=null; remember(); notifyTurn(prevActor); render();
    }
  }catch(e){ if(!loadErr){ loadErr='Connection problem — retrying…'; render(); } }
}
function startPolling(){ stopPolling(); pollT=setInterval(()=>{ if(document.visibilityState==='visible') refresh(); }, POLL_MS); }
function stopPolling(){ if(pollT) clearInterval(pollT); pollT=null; }

/* write a move. mutator edits a copy of the state */
async function commit(mutator){
  if(busy) return;
  const before=structuredClone(cur.state);
  const s=structuredClone(cur.state);
  const prevActor=actor(s);
  mutator(s);
  if(!isLive()){
    cur.state=s; cur.ver++; undoInfo={state:before, ver:cur.ver};
    remember(); if(actor(s)!==prevActor) passTo=actor(s); render(); window.scrollTo({top:0,behavior:'smooth'}); return;
  }
  busy=true; render();
  try{
    const r=await rpc('save_game',{p_id:cur.id, p_state:s, p_expected:cur.ver});
    if(r.ok){ cur.state=r.state; cur.ver=r.version; undoInfo={state:before, ver:r.version}; ping(); }
    else if(r.missing){ loadErr='This game doesn’t exist anymore.'; }
    else { cur.state=r.state; cur.ver=r.version; undoInfo=null; toast('Your friend moved first — here’s the latest.'); }
    remember();
  }catch(e){ toast('Couldn’t save — check your connection and try again.'); }
  busy=false; render(); window.scrollTo({top:0,behavior:'smooth'});
}
async function undo(){
  if(!undoInfo) return;
  const u=undoInfo;
  if(!isLive()){ cur.state=u.state; cur.ver++; undoInfo=null; passTo=null; remember(); render(); toast('Move undone'); return; }
  busy=true; render();
  try{
    const r=await rpc('save_game',{p_id:cur.id, p_state:u.state, p_expected:u.ver});
    if(r.ok){ cur.state=r.state; cur.ver=r.version; ping(); toast('Move undone'); }
    else { cur.state=r.state; cur.ver=r.version; toast('Too late — your friend already moved.'); }
    undoInfo=null; remember();
  }catch(e){ toast('Couldn’t undo — check your connection.'); }
  busy=false; render();
}

/* ================= actions ================= */
function actPick(name, kind){
  const s=cur.state; const nextPicker = s.st==='done' ? other(s.p) : s.p; const round = s.st==='done' ? s.r+1 : s.r;
  setSecret(s.id, round, name);
  commit(st=>{ st.p=nextPicker; st.r=round; st.st='guess'; st.k=kind; st.g=[]; st.a=null; st.gu=0; });
}
const actGuess=text=>commit(st=>{ st.g.push([text,null]); });
const actScore=n=>commit(st=>{ lastGuess(st)[1]=n; });
const actSolve=answer=>commit(st=>{ lastGuess(st)[1]=100; st.st='done'; st.a=answer; st.gu=0; st.s=(st.s||0)+1; st.h=[[st.p,answer,st.g.length,0],...st.h].slice(0,10); });
const actGiveUp=()=>commit(st=>{ st.st='reveal'; });
const actReveal=answer=>commit(st=>{ st.st='done'; st.a=answer; st.gu=1; st.h=[[st.p,answer,st.g.length,1],...st.h].slice(0,10); });
async function actJoin(name){
  if(busy) return;
  busy=true; render();
  try{
    // re-read so we never overwrite someone who joined a moment ago
    const r=await rpc('get_game',{p_id:cur.id});
    if(!r){ loadErr='This game doesn’t exist anymore.'; }
    else{
      cur.state=r.state; cur.ver=r.version;
      if(cur.state.tok[1] && cur.state.tok[1]!==mem.token){ toast('Someone else already joined this game.'); }
      else if(cur.state.st==='lobby'){
        const s=structuredClone(cur.state); s.n[1]=name; s.tok[1]=mem.token; s.st='pick'; s.p=s.fp;
        const w=await rpc('save_game',{p_id:cur.id, p_state:s, p_expected:cur.ver});
        cur.state=w.state; cur.ver=w.version; if(w.ok) ping(); else if(w.state.tok[1]!==mem.token) toast('Someone else already joined this game.');
        mem.myName=name;
      }
      remember();
    }
  }catch(e){ toast('Couldn’t join — check your connection.'); }
  busy=false; render();
}

/* ================= navigation ================= */
async function openLive(id){
  stopPolling(); realtimeLeave();
  const cached=mem.games[id];
  cur={id, state: cached&&cached.state ? cached.state : null, ver: cached&&cached.ver ? cached.ver : 0, mode:'live'};
  if(!cur.state) cur.state={mode:'live', st:'loading', n:[], tok:[], g:[], h:[]};
  cur.state.mode='live'; loadErr=''; undoInfo=null; passTo=null; flash=''; render();
  try{
    const r=await rpc('get_game',{p_id:id});
    if(!cur || cur.id!==id) return;
    if(!r){ cur=null; flash='That game link doesn’t work — it may have been deleted. Start a new one.'; history.replaceState(null,'',location.pathname); render(); return; }
    cur.state=r.state; cur.ver=r.version; remember();
  }catch(e){ loadErr='Couldn’t reach the game — check your connection.'; }
  render(); realtimeJoin(id); startPolling();
}
function openLocal(id){
  stopPolling(); realtimeLeave();
  const g=mem.games[id]; if(!g){ goHome(); return; }
  cur={id, state:g.state, ver:g.ver||1, mode:'local'}; undoInfo=null; passTo=null; flash=''; render();
}
function openGame(id){
  const g=mem.games[id]; if(!g) return;
  history.pushState(null,'', g.mode==='live' ? '?g='+id : '?local='+id);
  route(); window.scrollTo(0,0);
}
function goHome(){ stopPolling(); realtimeLeave(); cur=null; undoInfo=null; passTo=null; flash=''; deleteArm=false; history.pushState(null,'',location.pathname); render(); window.scrollTo(0,0); }
function route(){
  const q=new URLSearchParams(location.search);
  if(q.get('g') && /^[A-Za-z0-9]{8,24}$/.test(q.get('g'))) return openLive(q.get('g'));
  if(q.get('local')) return openLocal(q.get('local'));
  // legacy links from the old link-passing version
  if(location.hash.startsWith('#g=')){ flash='That’s a link from the old version of Warmer. Start a new live game below.'; history.replaceState(null,'',location.pathname); }
  stopPolling(); realtimeLeave(); cur=null; render();
}
window.addEventListener('popstate', route);

/* ================= views ================= */
function header(){
  return h('header',null,
    h('button',{class:'logo',onclick:goHome},h('span',null,'🔥'),'Warmer'),
    cur ? h('button',{class:'hlink',onclick:goHome},'All games') : null);
}

function viewHome(){
  const list=Object.values(mem.games).filter(g=>g.state && g.state.n).sort((a,b)=>(b.updated||0)-(a.updated||0));
  const kids=[header()];
  if(flash) kids.push(h('div',{class:'note'},flash));
  kids.push(
    h('h1',null,'Guess who I’m thinking of.'),
    h('p',{class:'lead'},'A two-player game. One of you thinks of a person, the other guesses people, and every guess gets a score from 0 to 100 for how close it is.'),
    h('div',{class:'how'},
      h('div',null,h('b',null,'1'),h('span',null,'Pick anyone — someone famous, or someone you both know.')),
      h('div',null,h('b',null,'2'),h('span',null,'Your friend guesses one person at a time.')),
      h('div',null,h('b',null,'3'),h('span',null,'You score each guess. Thinking of Obama? Katy Perry gets a 5. Trump gets an 85.')),
      h('div',null,h('b',null,'4'),h('span',null,'Keep going until they get it. Then swap.'))),
    h('div',{class:'stack'},
      h('button',{class:'btn',onclick:()=>renderSetup('live')},'Play with a friend'),
      h('button',{class:'btn ghost',onclick:()=>renderSetup('local')},'Play on one phone')),
    h('p',{class:'small',style:'margin-top:10px'},'Send your friend one invite link. After that you play live — both phones update instantly. No sign-up.'));
  if(list.length){
    kids.push(h('h2',{style:'margin-top:30px;font-size:18px'},'Your games'));
    kids.push(h('div',{class:'games'}, list.map(g=>{
      const s=g.state; const me = s.mode==='local' ? null : s.tok.indexOf(mem.token);
      const opp = s.mode==='local' ? `${s.n[0]} & ${s.n[1]}` : (s.st==='lobby' ? 'Waiting for your friend to join' : `with ${s.n[other(me)]||'friend'}`);
      const myTurn = s.mode==='local' || actor(s)===me;
      return h('button',{class:'gi',onclick:()=>openGame(g.id)},
        h('span',null,h('div',{class:'who'},opp),h('div',{class:'st'},`Round ${s.r} · ${s.s} solved${s.mode==='local'?' · one phone':''}`)),
        s.st==='lobby' ? h('span',{class:'st'},'Invite') : myTurn ? h('span',{class:'turn'}, s.mode==='local'?'Open':'Your turn') : h('span',{class:'st'},'Their turn'));
    })));
  }
  app.replaceChildren(...kids);
}

function whoFirstSeg(labels, init, onChange){
  let v=init; const seg=h('div',{class:'seg'});
  const draw=()=>seg.replaceChildren(...labels.map((l,i)=>h('button',{type:'button',class:i===v?'on':'',onclick:()=>{v=i;draw();onChange(v);}},l)));
  draw(); return seg;
}

function renderSetup(mode){
  let fp=0;
  const err=h('div',{class:'err'});
  if(mode==='live'){
    const a=h('input',{class:'field',type:'text',placeholder:'Your name',maxlength:24,autocomplete:'given-name',value:mem.myName||''});
    const go=h('button',{class:'btn',onclick:async()=>{
      const n0=clean(a.value,24); if(!n0){ err.textContent='Add your name.'; return; }
      go.disabled=true; go.textContent='Creating game…';
      mem.myName=n0; persist();
      const s=newState('live', n0, null, fp);
      try{
        const r=await rpc('create_game',{p_id:s.id, p_state:s});
        mem.games[s.id]={id:s.id, mode:'live', state:r.state, ver:r.version, updated:Date.now()}; persist();
        history.pushState(null,'','?g='+s.id); route();
      }catch(e){ err.textContent='Couldn’t create the game — check your connection.'; go.disabled=false; go.textContent='Create game & get invite link'; }
    }},'Create game & get invite link');
    a.addEventListener('keydown',e=>{ if(e.key==='Enter') go.click(); });
    app.replaceChildren(header(), h('div',{class:'card'},
      h('h2',null,'Play with a friend'),
      h('p',{class:'sub'},'You’ll get an invite link to send. Once your friend opens it, you play live together.'),
      h('label',{class:'l'},'Your name'), a,
      h('label',{class:'l'},'Who picks first?'), whoFirstSeg(['Me','My friend'],0,v=>fp=v), err, go));
    setTimeout(()=>a.focus(),50);
    return;
  }
  const a=h('input',{class:'field',type:'text',placeholder:'Player 1',maxlength:24,autocomplete:'off'});
  const b=h('input',{class:'field',type:'text',placeholder:'Player 2',maxlength:24,autocomplete:'off'});
  const seg=h('div');
  const drawSeg=()=>seg.replaceChildren(whoFirstSeg([clean(a.value)||'Player 1', clean(b.value)||'Player 2'], fp, v=>fp=v));
  [a,b].forEach(i=>i.addEventListener('input',drawSeg)); drawSeg();
  const go=h('button',{class:'btn',onclick:()=>{
    const n0=clean(a.value,24), n1=clean(b.value,24);
    if(!n0||!n1){ err.textContent='Add both names.'; return; }
    if(norm(n0)===norm(n1)){ err.textContent='Use two different names so you can tell whose turn it is.'; return; }
    const s=newState('local', n0, n1, fp);
    mem.games[s.id]={id:s.id, mode:'local', state:s, ver:1, updated:Date.now()}; persist();
    history.pushState(null,'','?local='+s.id); route(); passTo=fp; render();
  }},'Start');
  [a,b].forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') go.click(); }));
  app.replaceChildren(header(), h('div',{class:'card'},
    h('h2',null,'Play on one phone'),
    h('p',{class:'sub'},'Pass the phone back and forth. The game hides the answer when it’s the guesser’s turn.'),
    h('label',{class:'l'},'Player 1'), a, h('label',{class:'l'},'Player 2'), b,
    h('label',{class:'l'},'Who picks first?'), seg, err, go));
  setTimeout(()=>a.focus(),50);
}

function shareButtons(url, msg){
  const text=`${msg} ${url}`;
  const kids=[h('a',{class:'btn wa',href:'https://wa.me/?text='+encodeURIComponent(text),target:'_blank',rel:'noopener'},'Send on WhatsApp')];
  if(navigator.share) kids.push(h('button',{class:'btn ghost',onclick:async()=>{ try{ await navigator.share({text:msg,url}); }catch(e){} }},'Share another way'));
  kids.push(h('button',{class:'btn ghost',onclick:async()=>{ try{ await navigator.clipboard.writeText(url); toast('Invite link copied'); }catch(e){ window.prompt('Copy this link:', url); } }},'Copy link'));
  return h('div',{class:'stack'},kids);
}

function viewLobby(){
  const s=cur.state, me=myRole();
  if(me===0){
    const first = s.fp===0 ? 'You pick first.' : 'Your friend picks first.';
    return [h('div',{class:'card'},
      h('div',{class:'eyebrow'},h('span',null,'Invite'),h('span',{class:'live'},h('i'),'Live')),
      h('div',{class:'big'},'Send your friend this link'),
      h('p',{class:'sub'},`${first} The game starts as soon as they open the link and join.`),
      shareButtons(gameUrl(s.id), `${s.n[0]} challenged you to Warmer 🔥 Guess who I'm thinking of:`)),
      h('div',{class:'card waiting'},h('span',{class:'dots'},h('i'),h('i'),h('i')),'Waiting for your friend to join…')];
  }
  // joiner
  if(s.tok[1] && s.tok[1]!==mem.token) return [h('div',{class:'card'},h('h2',null,'This game is full'),h('p',{class:'sub'},'Two people are already playing it. Start your own game instead.'),h('button',{class:'btn',onclick:goHome},'Start a game'))];
  const a=h('input',{class:'field',type:'text',placeholder:'Your name',maxlength:24,autocomplete:'given-name',value:mem.myName||''});
  const err=h('div',{class:'err'});
  const go=h('button',{class:'btn',disabled:busy,onclick:()=>{
    const n=clean(a.value,24); if(!n){ err.textContent='Add your name.'; return; }
    if(norm(n)===norm(s.n[0])){ err.textContent=`Pick a name that isn’t ${s.n[0]} so you can tell turns apart.`; return; }
    actJoin(n); }}, busy?'Joining…':'Join game');
  a.addEventListener('keydown',e=>{ if(e.key==='Enter') go.click(); });
  setTimeout(()=>a.focus(),60);
  return [h('div',{class:'card'},
    h('div',{class:'eyebrow'},h('span',null,'You’re invited')),
    h('div',{class:'big'},`${s.n[0]} wants to play Warmer`),
    h('p',{class:'sub'},`One of you thinks of a person, the other guesses, and every guess gets a 0–100 score. ${s.fp===0?s.n[0]+' picks first — you guess.':'You pick first.'}`),
    h('label',{class:'l'},'Your name'), a, err, go)];
}

function statusCard(){
  const s=cur.state, m=myRole(), act=actor(s), picker=s.p, guesser=other(s.p);
  const P=s.n[picker], G=s.n[guesser];
  const youP = isLive() && m===picker, youG = isLive() && m===guesser;
  const scored=s.g.filter(x=>x[1]!=null);
  const best=scored.length ? scored.reduce((a,b)=>b[1]>a[1]?b:a) : null;
  const top=l=>h('div',{class:'eyebrow'},h('span',null,l),h('span',{class:'badge'},`🔥 ${s.s} solved`));
  if(s.st==='done'){
    return h('div',{class:'card solved'}, h('div',{class:'eyebrow'},h('span',null, s.gu?'🏳️ Gave up':`✓ Got it in ${s.g.length}`),h('span',{class:'badge'},`🔥 ${s.s} solved`)),
      h('div',{class:'sub',style:'margin-top:10px'}, `${youP?'You were':P+' was'} thinking of`),
      h('div',{class:'big'}, s.a),
      h('div',{class:'ex'}, scored.map(x=>h('span',{class:'chip',style:'background:#17141f;color:#fff'},x[1]))),
      act!==m && isLive() ? h('div',{class:'sub',style:'margin-top:10px'},`${G} picks next — waiting for them…`) : null);
  }
  if(s.st==='pick') return h('div',{class:'card'}, top(`Round ${s.r}`), h('div',{class:'big'}, act===m?'Your turn to pick.':`${P} is picking…`),
    h('div',{class:'sub'}, act===m?`Think of someone for ${G} to guess.`:'Hang tight — this screen updates by itself.'));
  if(s.st==='reveal') return h('div',{class:'card'}, top(`Round ${s.r}`), h('div',{class:'big'}, `${youG?'You':G} gave up 🏳️`),
    h('div',{class:'sub'}, act===m?'Reveal who you were thinking of.':`Waiting for ${P} to reveal the answer…`));
  const l=lastGuess(s);
  const kind = s.k==='mutual'?'someone you both know':'someone famous';
  if(l && l[1]==null) return h('div',{class:'card'}, top(`Round ${s.r} · ${ordinal(s.g.length)} guess`),
    h('div',{class:'big'}, `${l[0]}?`), h('div',{class:'sub'}, act===m?`${G} guessed this. How close is it?`:`Waiting for ${P} to score it…`));
  if(best){
    const lastS=scored[scored.length-1], w=warmth(lastS[1]);
    return h('div',{class:'card'}, top(`Round ${s.r} · ${s.g.length} ${s.g.length===1?'guess':'guesses'}`),
      h('div',{style:'display:flex;align-items:center;gap:14px;margin-top:10px'},
        h('div',{class:'bignum',style:`color:${w.color}`}, lastS[1]),
        h('div',null,h('div',{class:'gname'},lastS[0]),h('div',{class:'sub',style:`color:${w.color}`},w.label))),
      h('div',{class:'sub',style:'margin-top:10px'}, act===m?`Hottest so far: ${best[0]} (${best[1]}). Guess again.`:`Waiting for ${G}’s next guess…`));
  }
  return h('div',{class:'card'}, top(`Round ${s.r}`), h('div',{class:'big'}, act===m?`${P} picked someone.`:`${G} is guessing…`),
    h('div',{class:'sub'}, act===m?`It’s ${kind}. Who is it?`:`You picked ${kind}.`));
}

function secretRow(){
  const s=cur.state; const name=secretsFor(s.id)[s.r];
  if(!name) return h('div',{class:'note'},'This device doesn’t have your pick saved (did you pick on another phone?). Score from memory.');
  let shown = isLive();
  const b=h('b',null, shown?name:'••••••');
  const tip=h('span',{class:'small'}, shown?'Hide':'Tap to show');
  return h('button',{class:'secret',onclick:()=>{ shown=!shown; b.textContent=shown?name:'••••••'; tip.textContent=shown?'Hide':'Tap to show'; }}, h('span',null,'You picked ',b), tip);
}

function actionArea(){
  const s=cur.state, m=myRole(), act=actor(s);
  if(act!==m) return isLive() && undoInfo ? h('div',{style:'text-align:center;margin:-4px 0 10px'},h('button',{class:'linkbtn',disabled:busy,onclick:undo},'Undo my last move')) : null;
  if(s.st==='pick' || s.st==='done') return pickForm();
  if(s.st==='reveal') return revealForm();
  const l=lastGuess(s);
  if(l && l[1]==null) return scoreForm();
  return guessForm();
}

function pickForm(){
  const s=cur.state; let kind='famous';
  const nextGuesser = s.st==='done' ? s.n[s.p] : s.n[other(s.p)];
  const inp=h('input',{class:'field',type:'text',placeholder:'e.g. Barack Obama',maxlength:50,autocomplete:'off'});
  const seg=whoFirstSeg(['Someone famous','Someone we know'],0,v=>kind=v?'mutual':'famous');
  const err=h('div',{class:'err'});
  const go=h('button',{class:'btn',disabled:busy,onclick:()=>{ const v=clean(inp.value); if(!v){ err.textContent='Type a name first.'; return; } actPick(v,kind); }}, busy?'Saving…':'Lock it in');
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go.click(); });
  setTimeout(()=>inp.focus(),60);
  return h('div',{class:'card'}, h('h2',null, s.st==='done'?`Round ${s.r+1}: your pick`:'Who are you thinking of?'),
    h('p',{class:'sub'},`${nextGuesser} won’t see this. Spell it the way you’d want it revealed.`), inp, seg, err, go);
}

function guessForm(){
  const s=cur.state;
  const inp=h('input',{class:'field',type:'text',placeholder:'Who is it?',maxlength:50,autocomplete:'off'});
  const err=h('div',{class:'err'});
  const go=h('button',{class:'btn',disabled:busy,onclick:()=>{
    const v=clean(inp.value); if(!v){ err.textContent='Type a name.'; return; }
    if(s.g.some(x=>norm(x[0])===norm(v))){ err.textContent='You already guessed them.'; return; }
    actGuess(v); }}, busy?'Sending…':`Send guess #${s.g.length+1}`);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go.click(); });
  setTimeout(()=>inp.focus(),60);
  let confirming=false;
  const give=h('button',{class:'linkbtn',onclick:()=>{
    if(!confirming){ confirming=true; give.textContent='Tap again to give up and see the answer'; return; }
    actGiveUp(); }},'I give up');
  return h('div',{class:'card'}, h('h2',null,'Your guess'), inp, err, go, s.g.length?h('div',{style:'text-align:center'},give):null);
}

function scoreForm(){
  const s=cur.state, l=lastGuess(s), secret=secretsFor(s.id)[s.r];
  let val=null;
  const num=h('b',{style:'color:var(--muted)'},'?'), lab=h('span',{class:'sub'},'Drag or tap a number');
  const range=h('input',{type:'range',min:0,max:99,value:50,'aria-label':'Score',style:'opacity:.45'});
  const send=h('button',{class:'btn',disabled:true,onclick:()=>{ if(val==null||busy) return; actScore(val); }},'Send score');
  const set=v=>{ val=v; range.value=v; range.style.opacity='1'; num.textContent=v; num.style.color=warmth(v).color; lab.textContent=warmth(v).label; lab.style.color=warmth(v).color; send.disabled=busy; send.textContent=`Send ${v}`; };
  range.addEventListener('input',()=>set(+range.value));
  const quick=h('div',{class:'quick'}, [5,25,50,75,95].map(v=>h('button',{style:`background:${warmth(v).color}`,onclick:()=>set(v)},v)));
  const isMatch = secret && norm(secret)===norm(l[0]);
  const box=h('div');
  const openConfirm=()=>{
    const ans=h('input',{class:'field',type:'text',value:secret||l[0],maxlength:50});
    box.replaceChildren(h('div',{class:'confirm'},
      h('div',{class:'sub',style:'margin-bottom:8px'},'Nice. Confirm how the answer should be shown:'), ans,
      h('div',{class:'row',style:'margin-top:10px'},
        h('button',{class:'btn ghost',onclick:()=>box.replaceChildren()},'Cancel'),
        h('button',{class:'btn',onclick:()=>{ const a=clean(ans.value)||l[0]; actSolve(a); }},'End round 🎯'))));
  };
  return h('div',{class:'card'}, secretRow(),
    h('div',{class:'sub'},`${s.n[other(s.p)]}’s ${ordinal(s.g.length)} guess`),
    h('div',{class:'big'},`${l[0]}?`),
    isMatch ? h('div',{class:'match'},'That matches your pick — tap “They got it!”') : null,
    h('div',{class:'scoreBox'},num,lab), range,
    h('div',{class:'scale'},h('span',null,'0 · nothing alike'),h('span',null,'99 · so close')),
    quick,
    h('div',{class:'stack',style:'margin-top:14px'}, send, h('button',{class:'btn dark',onclick:openConfirm},'They got it! 🎯')), box);
}

function revealForm(){
  const s=cur.state, secret=secretsFor(s.id)[s.r];
  const ans=h('input',{class:'field',type:'text',value:secret||'',placeholder:'Who were you thinking of?',maxlength:50});
  const err=h('div',{class:'err'});
  return h('div',{class:'card'}, h('h2',null,'Reveal your pick'), ans, err,
    h('button',{class:'btn',disabled:busy,onclick:()=>{ const a=clean(ans.value); if(!a){ err.textContent='Type the name.'; return; } actReveal(a); }},'Reveal'));
}

function guessList(){
  const s=cur.state; if(!s.g.length || s.st==='done') return null;
  return h('div',{class:'card'}, h('div',{class:'eyebrow'},h('span',null,'Guesses'),h('span',null,`${s.g.length}`)),
    h('div',{class:'gl'}, s.g.map((x,i)=>[x,i]).reverse().map(([x,i])=>{
      const sc=x[1];
      return h('div',{class:'g'+(sc==null?' pend':'')}, h('span',{class:'n'},i+1), h('span',{class:'t'},x[0]),
        sc==null ? h('span',{class:'small'},'waiting') : chip(sc),
        h('div',{class:'bar'},h('i',{style:`width:${sc==null?0:sc}%;background:${sc==null?'transparent':warmth(sc).color}`})));
    })));
}

function historyCard(){
  const s=cur.state; if(!s.h || !s.h.length) return null;
  return h('div',{class:'card hist'}, h('div',{class:'eyebrow',style:'margin-bottom:6px'},h('span',null,'Past rounds')),
    s.h.map(x=>h('div',{class:'li'},h('span',null,`${s.n[x[0]]} picked `,h('b',null,x[1])),h('span',{class:'small'}, x[3]?'gave up':`${x[2]} ${x[2]===1?'guess':'guesses'}`))));
}

function passScreen(){
  const who=cur.state.n[passTo];
  return h('div',{class:'pass'},h('div',{class:'inner'},
    h('div',{class:'emoji'},'📱'),
    h('h2',{style:'margin:12px 0 6px'},`Pass the phone to ${who}`),
    h('p',{class:'sub',style:'margin:0 0 20px'},'No peeking.'),
    h('button',{class:'btn',onclick:()=>{ passTo=null; undoInfo=null; render(); }},`I’m ${who} — continue`),
    undoInfo ? h('button',{class:'linkbtn',onclick:undo},'Undo last move') : null));
}

function viewGame(){
  const s=cur.state;
  const kids=[header()];
  if(flash) kids.push(h('div',{class:'note'},flash));
  if(loadErr) kids.push(h('div',{class:'note'},loadErr));
  if(s.st==='loading'){ kids.push(h('div',{class:'card waiting'},h('span',{class:'dots'},h('i'),h('i'),h('i')),'Loading game…')); app.replaceChildren(...kids); return; }
  if(s.st==='lobby'){ kids.push(...viewLobby()); app.replaceChildren(...kids); return; }
  const m=myRole();
  if(isLive() && m<0){ kids.push(h('div',{class:'card'},h('h2',null,'This game is full'),h('p',{class:'sub'},`${s.n[0]} and ${s.n[1]} are already playing. Start your own game instead.`),h('button',{class:'btn',onclick:goHome},'Start a game'))); app.replaceChildren(...kids); return; }
  kids.push(isLive()
    ? h('div',{class:'meta-line'},h('span',null,`You’re ${s.n[m]} · vs ${s.n[other(m)]}`),h('span',{class:'live'},h('i'),'Live'))
    : h('div',{class:'meta-line'},h('span',null,`${s.n[0]} & ${s.n[1]} · one phone · now: ${s.n[actor(s)]}`)));
  const scoring = s.st==='guess' && lastGuess(s) && lastGuess(s)[1]==null && actor(s)===m;
  if(!scoring) kids.push(statusCard());
  const a=actionArea(); if(a) kids.push(a);
  const gl=guessList(); if(gl) kids.push(gl);
  const hc=historyCard(); if(hc) kids.push(hc);
  kids.push(h('div',{style:'text-align:center'},h('button',{class:'linkbtn',onclick:()=>{
    if(deleteArm){ delete mem.games[s.id]; persist(); deleteArm=false; goHome(); toast('Removed from this device'); }
    else { deleteArm=true; render(); } }}, deleteArm?'Tap again to remove this game from this device':'Remove game')));
  if(passTo!=null && !isLive()) kids.push(passScreen());
  app.replaceChildren(...kids);
}

function render(){
  // keep whatever the person was typing if the screen redraws under them
  const ae=document.activeElement; const keep = ae && ae.classList && ae.classList.contains('field') ? {ph:ae.placeholder, v:ae.value} : null;
  if(!cur){ deleteArm=false; viewHome(); } else viewGame();
  if(keep && keep.v){ const f=[...app.querySelectorAll('input.field')].find(x=>x.placeholder===keep.ph); if(f && !f.value){ f.value=keep.v; f.focus(); } }
}
route();
</script>
